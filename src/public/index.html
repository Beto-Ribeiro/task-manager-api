<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager API - MVP</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <h1 class="logo">Task Manager MVP</h1>
      <nav class="nav">
        <button class="nav-link active" data-section="section-list">Tarefas</button>
        <button class="nav-link" data-section="section-create">Nova Tarefa</button>
        <button class="nav-link" data-section="section-detail">Visualizar por ID</button>
      </nav>
    </div>
  </header>

  <main class="container main">
    <div id="feedback" class="feedback hidden"></div>

    <!-- Secao 1: Listar, Atualizar e Deletar Tarefas -->
    <section id="section-list" class="section active">
      <div class="section-header">
        <h2>Lista de Tarefas</h2>
        <button class="btn" id="btn-go-create">Adicionar Tarefa</button>
      </div>
      <div id="tasks-container" class="tasks-list"></div>
    </section>

    <!-- Secao 2: Criar Nova Tarefa -->
    <section id="section-create" class="section">
      <div class="section-header">
        <h2>Nova Tarefa</h2>
      </div>
      <form id="form-create" class="form-card">
        <div class="field">
          <label for="create-title">Titulo</label>
          <input type="text" id="create-title" required placeholder="Digite o titulo da tarefa" />
        </div>
        <div class="field">
          <label for="create-description">Descricao</label>
          <textarea id="create-description" rows="3" placeholder="Digite a descricao (opcional)"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="btn-cancel-create">Cancelar</button>
          <button type="submit" class="btn">Salvar</button>
        </div>
      </form>
    </section>

    <!-- Secao 3: Visualizar / Buscar Tarefa por ID -->
    <section id="section-detail" class="section">
      <div class="section-header">
        <h2>Visualizar Tarefa</h2>
      </div>
      <form id="form-search-id" class="search-bar">
        <input type="number" id="search-id-input" min="1" required placeholder="Informe o ID da tarefa (ex: 1)" />
        <button type="submit" class="btn">Buscar</button>
      </form>
      <div id="detail-result"></div>
    </section>

    <!-- Secao 4: Editar Tarefa -->
    <section id="section-edit" class="section">
      <div class="section-header">
        <h2>Atualizar Tarefa</h2>
      </div>
      <form id="form-edit" class="form-card">
        <input type="hidden" id="edit-id" />
        <div class="field">
          <label for="edit-title">Titulo</label>
          <input type="text" id="edit-title" required />
        </div>
        <div class="field">
          <label for="edit-description">Descricao</label>
          <textarea id="edit-description" rows="3"></textarea>
        </div>
        <div class="field field-checkbox">
          <input type="checkbox" id="edit-completed" />
          <label for="edit-completed">Marcar como concluida</label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="btn-cancel-edit">Voltar</button>
          <button type="submit" class="btn">Atualizar</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
